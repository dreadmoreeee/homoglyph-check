[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homoglyph-check"
version = "0.1.0"
description = "Offline check for look-alike letters, invisible/bidi characters and look-alike domains in text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marvin Palencia" }]
keywords = ["unicode", "homoglyph", "confusables", "idn", "punycode", "uts39", "security"]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
homoglyph-check = "homoglyph_check.cli:main"

[tool.setuptools]
packages = ["homoglyph_check"]
